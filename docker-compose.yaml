services:
  backend:
    build:
      context: ./risein-crm/backend
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - ./risein-crm/backend:/app/data
      - ./risein-crm/backend/uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./risein-crm/frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
    ports:
      - "3000:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      - backend
    restart: always
